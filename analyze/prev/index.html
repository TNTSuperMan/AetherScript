<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>html{background:#000}canvas{image-rendering: pixelated;}</style>
</head>
<body>
    <canvas width="1000" height="1000"></canvas>
    <script type="module">
        const ctx = document.querySelector("canvas").getContext("2d");
        const data1 = await(await fetch("./data1")).json();
        ctx.strokeStyle = "#FF0000";
        ctx.beginPath();
        ctx.moveTo(0, 0);
        data1.forEach((e,i)=>{
            ctx.lineTo(i, e);
        });
        ctx.stroke();
        const data2 = await(await fetch("./data2")).json();
        ctx.strokeStyle = "#00FF00";
        ctx.beginPath();
        ctx.moveTo(0, 0);
        data2.forEach((e,i)=>{
            ctx.lineTo(i, e);
        });
        ctx.stroke();
        const data3 = await(await fetch("./data3")).json();
        ctx.strokeStyle = "#0000FF";
        ctx.beginPath();
        ctx.moveTo(0, 0);
        data3.forEach((e,i)=>{
            ctx.lineTo(i, e);
        });
        ctx.stroke();
    </script>
</body>
</html>
